<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Пасхалка</title>

<style>
body{
    max-width:700px;
    margin:40px auto;
    padding:20px;
    text-align:center;
    font-family:sans-serif;
    line-height:1.8;
}

img{
    max-width:100%;
    border-radius:12px;
    margin-top:20px;
}
</style>

</head>
<body>

<h2>Спасибо что отсканировали QR код</h2>

<p>На этом сайте нет ничего полезного.</p>

<p>
Кстати вы
<span id="visitor">...</span>
человек отсканировавший этот QR.
</p>

<p>Раз уж зашли желаю вам всего самого хорошего.</p>

<h3>Вот случайный мем не в тему</h3>

<img src="meme1.jpeg" alt="Мем">

<script>
fetch("https://api.countapi.xyz/hit/backpack-qr-site/visits")
.then(response => response.json())
.then(data => {
    document.getElementById("visitor").textContent = data.value + "-й";
})
.catch(() => {
    document.getElementById("visitor").textContent = "неизвестно какой";
});
</script>

</body>
</html>
