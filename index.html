<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Пасхалка</title>

<style>
body{
    max-width:700px;
    margin:40px auto;
    padding:20px;
    text-align:center;
    font-family:sans-serif;
    line-height:1.8;
}

img{
    max-width:100%;
    border-radius:12px;
    margin-top:20px;
}

#pong{
    margin-top:30px;
    border:2px solid black;
    max-width:100%;
    touch-action:none;
}
</style>

</head>
<body>

<h2>Спасибо что отсканировали QR код</h2>

<p>На этом сайте нет ничего полезного.</p>

<p>Раз уж зашли желаю вам всего самого хорошего.</p>

<h3>Вот случайный мем не в тему</h3>

<img src="meme1.jpeg" alt="Мем">

<canvas id="pong" width="600" height="350"></canvas>

<script>
const canvas = document.getElementById("pong");
const ctx = canvas.getContext("2d");

const paddleWidth = 10;
const paddleHeight = 80;

const player = {
    x: 10,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0
};

const ai = {
    x: canvas.width - 20,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0
};

const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 5,
    vy: 3,
    r: 8
};

function movePaddle(clientY) {
    const rect = canvas.getBoundingClientRect();

    const scaleY = canvas.height / rect.height;

    player.y =
        (clientY - rect.top) * scaleY
        - paddleHeight / 2;

    if(player.y < 0) player.y = 0;

    if(player.y > canvas.height - paddleHeight)
        player.y = canvas.height - paddleHeight;
}

canvas.addEventListener("mousemove", e => {
    movePaddle(e.clientY);
});

canvas.addEventListener("touchstart", e => {
    movePaddle(e.touches[0].clientY);
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    movePaddle(e.touches[0].clientY);
}, { passive:false });

function resetBall() {

    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;

    ball.vx =
        (Math.random() > 0.5 ? 5 : -5);

    ball.vy =
        (Math.random() * 6) - 3;
}

function update() {

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (
        ball.y < ball.r ||
        ball.y > canvas.height - ball.r
    ) {
        ball.vy *= -1;
    }

    if (
        ball.x - ball.r <
        player.x + paddleWidth &&
        ball.y > player.y &&
        ball.y < player.y + paddleHeight
    ) {
        ball.vx = Math.abs(ball.vx);
    }

    if (
        ball.x + ball.r > ai.x &&
        ball.y > ai.y &&
        ball.y < ai.y + paddleHeight
    ) {
        ball.vx = -Math.abs(ball.vx);
    }

    ai.y +=
        (ball.y - (ai.y + paddleHeight/2))
        * 0.08;

    if(ball.x < 0){
        ai.score++;
        resetBall();
    }

    if(ball.x > canvas.width){
        player.score++;
        resetBall();
    }
}

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font = "30px sans-serif";

    ctx.fillText(
        player.score,
        canvas.width / 4,
        40
    );

    ctx.fillText(
        ai.score,
        canvas.width * 3 / 4,
        40
    );

    ctx.fillRect(
        player.x,
        player.y,
        paddleWidth,
        paddleHeight
    );

    ctx.fillRect(
        ai.x,
        ai.y,
        paddleWidth,
        paddleHeight
    );

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
